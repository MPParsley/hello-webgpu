<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edge NLP Chat</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
      color: #333;
      min-height: 100vh;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 32px);
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      color: #222;
    }

    /* Error message styling */
    .error {
      background: #fee;
      border: 1px solid #c00;
      color: #900;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .error h2 {
      margin: 0 0 8px 0;
      font-size: 1.1rem;
    }

    .error p {
      margin: 0;
      font-size: 0.95rem;
    }

    /* Info box */
    .info {
      background: #e8f4ff;
      border: 1px solid #b8d4ff;
      color: #0055aa;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }

    /* Model selector */
    .model-selector {
      margin-bottom: 16px;
    }

    .model-selector label {
      display: block;
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 6px;
    }

    .model-selector select {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
      cursor: pointer;
    }

    .model-selector select:disabled {
      background: #f0f0f0;
      cursor: not-allowed;
    }

    /* Progress section */
    .progress-section {
      margin-bottom: 16px;
      display: none;
    }

    .progress-section.visible {
      display: block;
    }

    .progress-label {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 8px;
    }

    .progress-bar-container {
      background: #e0e0e0;
      border-radius: 8px;
      height: 24px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      background: linear-gradient(90deg, #0066cc, #00aaff);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 8px;
    }

    .progress-percentage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.8rem;
      font-weight: 600;
      color: #333;
    }

    .progress-status {
      font-size: 0.85rem;
      color: #555;
      margin-top: 8px;
      min-height: 1.5em;
      word-break: break-word;
    }

    /* Chat container */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 300px;
    }

    /* Chat messages */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      background: #fafafa;
      min-height: 200px;
      max-height: 400px;
    }

    .message {
      margin-bottom: 16px;
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 85%;
      word-wrap: break-word;
    }

    .message:last-child {
      margin-bottom: 0;
    }

    .message.user {
      background: #0066cc;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      background: #e9e9e9;
      color: #333;
      margin-right: auto;
      border-bottom-left-radius: 4px;
    }

    .message.assistant.typing::after {
      content: "▊";
      animation: blink 0.8s infinite;
    }

    .message-label {
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 4px;
      opacity: 0.7;
    }

    .message-content {
      white-space: pre-wrap;
    }

    .empty-chat {
      color: #999;
      text-align: center;
      padding: 40px;
      font-style: italic;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    /* Input section */
    .input-section {
      display: flex;
      gap: 12px;
    }

    .input-section textarea {
      flex: 1;
      padding: 14px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      resize: none;
      font-family: inherit;
      min-height: 52px;
      max-height: 120px;
    }

    .input-section textarea:focus {
      outline: none;
      border-color: #0066cc;
    }

    .input-section textarea:disabled {
      background: #f0f0f0;
    }

    .input-section button {
      width: auto;
      padding: 14px 24px;
      min-width: 100px;
    }

    /* Clear button */
    .clear-btn {
      background: #666;
      margin-top: 12px;
      padding: 10px 16px !important;
      font-size: 0.9rem !important;
      min-height: 40px !important;
    }

    .clear-btn:hover:not(:disabled) {
      background: #555;
    }

    /* Hidden class */
    .hidden {
      display: none !important;
    }

    /* Status indicator */
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 12px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ccc;
    }

    .status-dot.ready {
      background: #4caf50;
    }

    .status-dot.loading {
      background: #ff9800;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Edge NLP Chat</h1>

    <!-- Error container (hidden by default) -->
    <div id="error-container" class="hidden"></div>

    <!-- Info box -->
    <div class="info" id="info-box">
      Dit model draait volledig lokaal in je browser via WebGPU.
      Geen data wordt naar een server gestuurd.
    </div>

    <!-- Model selector -->
    <div class="model-selector">
      <label for="model-select">Kies een model:</label>
      <select id="model-select">
        <option value="SmolLM2-360M-Instruct-q4f16_1-MLC" selected>SmolLM2 360M (~380MB, snel)</option>
        <option value="TinyLlama-1.1B-Chat-v1.0-q4f16_1-MLC">TinyLlama 1.1B (~700MB, beter)</option>
        <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Qwen2.5 1.5B (~1.6GB, best)</option>
      </select>
    </div>

    <!-- Progress section -->
    <div class="progress-section" id="progress-section">
      <div class="progress-label">Model laden...</div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
        <span class="progress-percentage" id="progress-percentage">0%</span>
      </div>
      <div class="progress-status" id="progress-status">Initialiseren...</div>
    </div>

    <!-- Status indicator -->
    <div class="status-indicator" id="status-indicator">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Model niet geladen</span>
    </div>

    <!-- Chat container -->
    <div class="chat-container">
      <!-- Chat messages -->
      <div class="chat-messages" id="chat-messages">
        <div class="empty-chat" id="empty-chat">
          Start een gesprek door een bericht te typen...
        </div>
      </div>

      <!-- Input section -->
      <div class="input-section">
        <textarea
          id="user-input"
          placeholder="Typ je bericht..."
          rows="1"
          disabled
        ></textarea>
        <button id="send-btn" disabled>Verstuur</button>
      </div>

      <!-- Clear button -->
      <button id="clear-btn" class="clear-btn">Gesprek wissen</button>
    </div>
  </div>

  <script type="module">
    import * as webllm from "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm/+esm";

    // DOM elements
    const chatMessages = document.getElementById("chat-messages");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const clearBtn = document.getElementById("clear-btn");
    const errorContainer = document.getElementById("error-container");
    const progressSection = document.getElementById("progress-section");
    const progressBar = document.getElementById("progress-bar");
    const progressPercentage = document.getElementById("progress-percentage");
    const progressStatus = document.getElementById("progress-status");
    const infoBox = document.getElementById("info-box");
    const modelSelect = document.getElementById("model-select");
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const emptyChat = document.getElementById("empty-chat");

    // State
    let cachedEngine = null;
    let cachedModelId = null;
    let retryCount = 0;
    const MAX_RETRIES = 2;
    let isGenerating = false;
    let conversationHistory = [
      { role: "system", content: "Je bent een vriendelijke en behulpzame AI-assistent die lokaal in de browser draait. Houd je antwoorden bondig maar informatief. Antwoord in het Nederlands tenzij de gebruiker een andere taal gebruikt." }
    ];

    // Check WebGPU support
    function checkWebGPU() {
      if (!("gpu" in navigator)) {
        return {
          supported: false,
          reason: "WebGPU niet beschikbaar",
          details: "Je browser ondersteunt geen WebGPU. Probeer Chrome 113+, Edge 113+, of Safari 18+ (macOS Sonoma / iOS 18)."
        };
      }
      return { supported: true };
    }

    // Show error message (fatal)
    function showError(title, message) {
      errorContainer.innerHTML = `
        <div class="error">
          <h2>${title}</h2>
          <p>${message}</p>
        </div>
      `;
      errorContainer.classList.remove("hidden");
      infoBox.classList.add("hidden");
    }

    // Update progress UI
    function updateProgress(progress, text) {
      const percent = Math.round(progress * 100);
      progressBar.style.width = `${percent}%`;
      progressPercentage.textContent = `${percent}%`;
      progressStatus.textContent = text || "Laden...";
    }

    // Update status indicator
    function setStatus(status, text) {
      statusDot.className = "status-dot " + status;
      statusText.textContent = text;
    }

    // Add message to chat
    function addMessage(role, content, isStreaming = false) {
      if (emptyChat) {
        emptyChat.remove();
      }

      const messageDiv = document.createElement("div");
      messageDiv.className = `message ${role}` + (isStreaming ? " typing" : "");

      const labelDiv = document.createElement("div");
      labelDiv.className = "message-label";
      labelDiv.textContent = role === "user" ? "Jij" : "Assistent";

      const contentDiv = document.createElement("div");
      contentDiv.className = "message-content";
      contentDiv.textContent = content;

      messageDiv.appendChild(labelDiv);
      messageDiv.appendChild(contentDiv);
      chatMessages.appendChild(messageDiv);

      // Scroll to bottom
      chatMessages.scrollTop = chatMessages.scrollHeight;

      return contentDiv;
    }

    // Update last message content (for streaming)
    function updateLastMessage(content, isComplete = false) {
      const lastMessage = chatMessages.querySelector(".message:last-child");
      if (lastMessage) {
        const contentDiv = lastMessage.querySelector(".message-content");
        if (contentDiv) {
          contentDiv.textContent = content;
        }
        if (isComplete) {
          lastMessage.classList.remove("typing");
        }
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
    }

    // Load model
    async function loadModel() {
      const selectedModel = modelSelect.value;

      if (cachedEngine && cachedModelId === selectedModel) {
        return cachedEngine;
      }

      setStatus("loading", "Model laden...");
      progressSection.classList.add("visible");
      updateProgress(0, "Model initialiseren...");
      modelSelect.disabled = true;

      try {
        const engine = await webllm.CreateMLCEngine(selectedModel, {
          initProgressCallback: (report) => {
            updateProgress(report.progress, report.text);
          }
        });

        cachedEngine = engine;
        cachedModelId = selectedModel;
        retryCount = 0;

        progressSection.classList.remove("visible");
        setStatus("ready", `${modelSelect.options[modelSelect.selectedIndex].text.split(" (")[0]} geladen`);
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();

        return engine;

      } catch (error) {
        console.error("Load error:", error);
        const errorMsg = error.message || String(error);

        if ((errorMsg.includes("Load failed") || errorMsg.includes("fetch")) && retryCount < MAX_RETRIES) {
          retryCount++;
          const delay = retryCount * 2000;
          updateProgress(0, `Download mislukt. Opnieuw proberen (${retryCount}/${MAX_RETRIES})...`);
          await new Promise(r => setTimeout(r, delay));
          return loadModel();
        }

        progressSection.classList.remove("visible");
        setStatus("", "Laden mislukt");
        modelSelect.disabled = false;
        throw error;
      }
    }

    // Send message
    async function sendMessage() {
      const userText = userInput.value.trim();
      if (!userText || isGenerating) return;

      isGenerating = true;
      userInput.value = "";
      userInput.disabled = true;
      sendBtn.disabled = true;
      modelSelect.disabled = true;

      // Add user message to UI and history
      addMessage("user", userText);
      conversationHistory.push({ role: "user", content: userText });

      try {
        // Load model if needed
        const engine = await loadModel();

        // Add assistant message placeholder
        addMessage("assistant", "", true);
        setStatus("loading", "Antwoord genereren...");

        // Create chat completion with streaming
        const stream = await engine.chat.completions.create({
          messages: conversationHistory,
          stream: true,
          max_tokens: 500
        });

        // Stream tokens
        let fullResponse = "";
        for await (const chunk of stream) {
          const delta = chunk.choices[0]?.delta?.content || "";
          fullResponse += delta;
          updateLastMessage(fullResponse);
        }

        // Finalize
        updateLastMessage(fullResponse, true);
        conversationHistory.push({ role: "assistant", content: fullResponse });
        setStatus("ready", `${modelSelect.options[modelSelect.selectedIndex].text.split(" (")[0]} geladen`);

      } catch (error) {
        console.error("Error:", error);
        updateLastMessage(`Fout: ${error.message}`, true);
        setStatus("", "Fout opgetreden");
      } finally {
        isGenerating = false;
        userInput.disabled = false;
        sendBtn.disabled = false;
        modelSelect.disabled = cachedEngine !== null;
        userInput.focus();
      }
    }

    // Clear chat
    function clearChat() {
      chatMessages.innerHTML = `
        <div class="empty-chat" id="empty-chat">
          Start een gesprek door een bericht te typen...
        </div>
      `;
      conversationHistory = [conversationHistory[0]]; // Keep system prompt
    }

    // Auto-resize textarea
    function autoResize() {
      userInput.style.height = "auto";
      userInput.style.height = Math.min(userInput.scrollHeight, 120) + "px";
    }

    // Initialize
    async function init() {
      const webgpuCheck = checkWebGPU();
      if (!webgpuCheck.supported) {
        showError(webgpuCheck.reason, webgpuCheck.details);
        return;
      }

      try {
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
          showError(
            "WebGPU niet beschikbaar",
            "Je browser ondersteunt WebGPU, maar er is geen geschikte GPU gevonden."
          );
          return;
        }
      } catch (e) {
        showError("WebGPU fout", `Kon WebGPU niet initialiseren: ${e.message}`);
        return;
      }

      // Enable input and auto-load model
      setStatus("", "Klik om model te laden");
      userInput.disabled = false;
      sendBtn.disabled = false;
    }

    // Event listeners
    sendBtn.onclick = sendMessage;
    clearBtn.onclick = clearChat;

    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    userInput.addEventListener("input", autoResize);

    modelSelect.addEventListener("change", () => {
      // Reset engine when model changes
      if (cachedModelId !== modelSelect.value) {
        cachedEngine = null;
        cachedModelId = null;
        setStatus("", "Nieuw model geselecteerd");
      }
    });

    // Start
    init();
  </script>
</body>
</html>
