<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edge NLP Hello World</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      color: #222;
    }

    /* Error message styling */
    .error {
      background: #fee;
      border: 1px solid #c00;
      color: #900;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .error h2 {
      margin: 0 0 8px 0;
      font-size: 1.1rem;
    }

    .error p {
      margin: 0;
      font-size: 0.95rem;
    }

    /* Button styling - large touch targets */
    button {
      width: 100%;
      padding: 16px 24px;
      font-size: 1.1rem;
      font-weight: 600;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      min-height: 52px;
      transition: background 0.2s;
    }

    button:hover:not(:disabled) {
      background: #0052a3;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    /* Progress section */
    .progress-section {
      margin-top: 20px;
      display: none;
    }

    .progress-section.visible {
      display: block;
    }

    .progress-label {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 8px;
    }

    .progress-bar-container {
      background: #e0e0e0;
      border-radius: 8px;
      height: 24px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      background: linear-gradient(90deg, #0066cc, #00aaff);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 8px;
    }

    .progress-percentage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.8rem;
      font-weight: 600;
      color: #333;
    }

    .progress-status {
      font-size: 0.85rem;
      color: #555;
      margin-top: 8px;
      min-height: 1.5em;
      word-break: break-word;
    }

    /* Output section */
    .output-section {
      margin-top: 20px;
    }

    .output-label {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 8px;
    }

    #output {
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      min-height: 100px;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: inherit;
      font-size: 1rem;
      line-height: 1.5;
      margin: 0;
    }

    #output:empty::before {
      content: "Klik op de knop om te starten...";
      color: #999;
      font-style: italic;
    }

    /* Cursor animation for streaming */
    .typing::after {
      content: "▊";
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    /* Info box */
    .info {
      background: #e8f4ff;
      border: 1px solid #b8d4ff;
      color: #0055aa;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }

    /* Warning box */
    .warning {
      background: #fff8e6;
      border: 1px solid #f0c040;
      color: #806000;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      font-size: 0.85rem;
    }

    /* Model selector */
    .model-selector {
      margin-bottom: 16px;
    }

    .model-selector label {
      display: block;
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 6px;
    }

    .model-selector select {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
      cursor: pointer;
    }

    /* Retry button */
    .retry-btn {
      margin-top: 12px;
      background: #cc6600;
    }

    .retry-btn:hover:not(:disabled) {
      background: #a35200;
    }

    /* Hidden class */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Edge NLP – Hello World</h1>

    <!-- Error container (hidden by default) -->
    <div id="error-container" class="hidden"></div>

    <!-- Info box -->
    <div class="info" id="info-box">
      Dit model draait volledig lokaal in je browser via WebGPU.
      Geen data wordt naar een server gestuurd.
    </div>

    <!-- Model selector -->
    <div class="model-selector">
      <label for="model-select">Kies een model:</label>
      <select id="model-select">
        <option value="SmolLM2-360M-Instruct-q4f16_1-MLC" selected>SmolLM2 360M (~380MB, snel)</option>
        <option value="TinyLlama-1.1B-Chat-v1.0-q4f16_1-MLC">TinyLlama 1.1B (~700MB, beter)</option>
        <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Qwen2.5 1.5B (~1.6GB, best)</option>
      </select>
    </div>

    <!-- Main button -->
    <button id="run">Zeg hallo</button>

    <!-- Progress section -->
    <div class="progress-section" id="progress-section">
      <div class="progress-label">Model laden...</div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
        <span class="progress-percentage" id="progress-percentage">0%</span>
      </div>
      <div class="progress-status" id="progress-status">Initialiseren...</div>
    </div>

    <!-- Output section -->
    <div class="output-section">
      <div class="output-label">Antwoord:</div>
      <pre id="output"></pre>
    </div>
  </div>

  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    // DOM elements
    const output = document.getElementById("output");
    const button = document.getElementById("run");
    const errorContainer = document.getElementById("error-container");
    const progressSection = document.getElementById("progress-section");
    const progressBar = document.getElementById("progress-bar");
    const progressPercentage = document.getElementById("progress-percentage");
    const progressStatus = document.getElementById("progress-status");
    const infoBox = document.getElementById("info-box");
    const modelSelect = document.getElementById("model-select");

    // Keep track of loaded engine for reuse
    let cachedEngine = null;
    let cachedModelId = null;

    // Check WebGPU support
    function checkWebGPU() {
      if (!("gpu" in navigator)) {
        return {
          supported: false,
          reason: "WebGPU niet beschikbaar",
          details: "Je browser ondersteunt geen WebGPU. Probeer Chrome 113+, Edge 113+, of Safari 18+ (macOS Sonoma / iOS 18)."
        };
      }
      return { supported: true };
    }

    // Show error message (fatal - disables button)
    function showError(title, message) {
      errorContainer.innerHTML = `
        <div class="error">
          <h2>${title}</h2>
          <p>${message}</p>
        </div>
      `;
      errorContainer.classList.remove("hidden");
      button.disabled = true;
      infoBox.classList.add("hidden");
    }

    // Show retry error (non-fatal - shows retry button)
    function showRetryError(title, message) {
      output.innerHTML = `<strong style="color: #900;">${title}</strong>\n${message}\n\n<button class="retry-btn" onclick="location.reload()" style="padding: 10px 20px; background: #cc6600; color: white; border: none; border-radius: 6px; cursor: pointer;">Probeer opnieuw</button>`;
    }

    // Update progress UI
    function updateProgress(progress, text) {
      const percent = Math.round(progress * 100);
      progressBar.style.width = `${percent}%`;
      progressPercentage.textContent = `${percent}%`;
      progressStatus.textContent = text || "Laden...";
    }

    // Initialize on page load
    async function init() {
      // Check WebGPU
      const webgpuCheck = checkWebGPU();
      if (!webgpuCheck.supported) {
        showError(webgpuCheck.reason, webgpuCheck.details);
        return;
      }

      // Try to get adapter to verify WebGPU actually works
      try {
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
          showError(
            "WebGPU niet beschikbaar",
            "Je browser ondersteunt WebGPU, maar er is geen geschikte GPU gevonden. Controleer of je GPU-drivers up-to-date zijn."
          );
          return;
        }
      } catch (e) {
        showError(
          "WebGPU fout",
          `Kon WebGPU niet initialiseren: ${e.message}`
        );
        return;
      }

      console.log("WebGPU is beschikbaar en werkt.");
    }

    // Main chat function
    async function runChat() {
      const selectedModel = modelSelect.value;

      button.disabled = true;
      modelSelect.disabled = true;
      output.textContent = "";
      output.classList.remove("typing");
      progressSection.classList.add("visible");
      updateProgress(0, "Model initialiseren...");

      let engine = cachedEngine;

      try {
        // Only reload if model changed or no engine cached
        if (!engine || cachedModelId !== selectedModel) {
          console.log(`Loading model: ${selectedModel}`);

          // Create engine with progress callback
          engine = await webllm.CreateMLCEngine(selectedModel, {
            initProgressCallback: (report) => {
              console.log("Init progress:", report);
              updateProgress(report.progress, report.text);
            }
          });

          // Cache for reuse
          cachedEngine = engine;
          cachedModelId = selectedModel;
        } else {
          console.log("Using cached engine");
          updateProgress(1, "Model al geladen!");
        }

        // Update UI for generation phase
        progressSection.classList.remove("visible");
        output.classList.add("typing");

        // Create chat completion with streaming
        const stream = await engine.chat.completions.create({
          messages: [
            { role: "system", content: "Je bent een vriendelijk lokaal model dat in de browser draait. Houd je antwoorden kort en bondig." },
            { role: "user", content: "Zeg hallo vanuit de browser en vertel kort wat je bent." }
          ],
          stream: true,
          max_tokens: 150
        });

        // Stream tokens to output
        let fullResponse = "";
        for await (const chunk of stream) {
          const delta = chunk.choices[0]?.delta?.content || "";
          fullResponse += delta;
          output.textContent = fullResponse;
        }

        output.classList.remove("typing");

      } catch (error) {
        console.error("Error:", error);
        progressSection.classList.remove("visible");
        output.classList.remove("typing");

        // Clear cached engine on error
        cachedEngine = null;
        cachedModelId = null;

        const errorMsg = error.message || String(error);

        // Detect specific error types
        if (errorMsg.includes("Load failed") || errorMsg.includes("fetch")) {
          showRetryError(
            "Download mislukt",
            `Het model kon niet volledig worden gedownload. Dit kan gebeuren bij:\n• Trage of onstabiele internetverbinding\n• Model te groot voor je apparaat\n• Browser timeout\n\nTip: Probeer een kleiner model (SmolLM2) of ververs de pagina.`
          );
        } else if (errorMsg.includes("memory") || errorMsg.includes("OOM") || errorMsg.includes("allocation")) {
          showRetryError(
            "Onvoldoende geheugen",
            `Je apparaat heeft niet genoeg geheugen voor dit model.\n\nOplossingen:\n• Sluit andere tabbladen en apps\n• Kies een kleiner model\n• Probeer op een desktop/laptop`
          );
        } else if (errorMsg.includes("WebGPU") || errorMsg.includes("GPU")) {
          showRetryError(
            "WebGPU fout",
            `Er is een probleem met de GPU.\n\n${errorMsg}\n\nProbeer de pagina te verversen.`
          );
        } else {
          showRetryError(
            "Fout opgetreden",
            `${errorMsg}\n\nProbeer de pagina te verversen of kies een ander model.`
          );
        }
      } finally {
        button.disabled = false;
        modelSelect.disabled = false;
      }
    }

    // Event listeners
    button.onclick = runChat;

    // Run init check
    init();
  </script>
</body>
</html>
